[package]
name = "terminal-file-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = "0.29"
flate2 = "1.1"
ignore = "0.4"
ratatui = "0.30"
ratatui-themes = "0.3.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tar = "0.4"
tempfile = "3.21"
toml = "0.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
