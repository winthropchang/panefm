[package]
name = "panefm"
version = "0.1.12"
edition = "2024"
description = "A fast, pane-first terminal file manager with Vim-style controls"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = "0.29"
flate2 = "1.1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
nucleo-matcher = "0.3.1"
notify = "8.2.0"
ratatui = "0.30"
ratatui-themes = "0.3.0"
regex = "1.11"
self-replace = "1.5"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tar = "0.4"
tempfile = "3.21"
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "3.4", features = ["json"] }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
