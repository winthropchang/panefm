[actions]

# 這個檔案用來定義 `Open with` 面板中的自訂動作。
# 你可以在檔案或目錄上按 `Shift+o` / `Shift+Enter` 叫出這些選項。
#
# 常用欄位：
# - `name`：顯示在面板中的名稱
# - `scope`：`file` / `dir` / `both`
# - `mode`：`detached` / `terminal`
# - `command`：所有平台共用的預設指令
# - `mac_command`：只在 macOS 使用，優先於 `command`
# - `windows_command`：只在 Windows 使用，優先於 `command`
#
# 可用佔位字串：
# - `{path}`：目前選取項目的完整路徑
# - `{parent}`：目前選取項目的父目錄
# - `{name}`：目前顯示名稱，含副檔名
# - `{stem}`：去掉副檔名後的檔名

[[actions.open_with]]
name = "VSCode"
scope = "dir"
mode = "detached"
mac_command = "open -a 'Visual Studio Code' {path}"
windows_command = "code {path}"

# 在檔案或資料夾上顯示 git log。
# 適合在 git repo 裡快速查最近提交紀錄。
[[actions.open_with]]
name = "Git log"
scope = "both"
mode = "terminal"
command = "git -C {parent} log --oneline"
windows_command = "git -C {parent} log --oneline"

# 用 Xcode 開啟目錄。
# 適合 Apple 平台專案。
[[actions.open_with]]
name = "Xcode"
scope = "dir"
mode = "detached"
mac_command = "open -a Xcode {path}"

# 在終端中用 Vim 開啟檔案。
# 這會接管目前終端，所以使用 `terminal`。
[[actions.open_with]]
name = "Vim"
scope = "file"
mode = "terminal"
command = "vim {path}"

# 在系統檔案管理器中顯示目前檔案或目錄位置。
[[actions.open_with]]
name = "Reveal"
scope = "both"
mode = "detached"
mac_command = "open -R {path}"
