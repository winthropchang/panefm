# terminal-file-manager 的本機設定檔。
#
# 這份檔案會優先於預設值讀取；若要停用檔案圖示，將 enabled 改成 false。

[ui]
theme = "kanagawa"
poll_rate_ms = 120

[ui.icons]
# 在檔名左側顯示目錄、程式碼、圖片、壓縮檔等類型文字圖示。
enabled = true
# 若 Terminal 沒有 Nerd Font，改成 "ascii" 可避免圖示顯示成方框。
style = "nerd-font"

[ui.preview]
height = 8
focus_list_height = 6

[ui.dialog.confirm]
width_percent = 60
height = 5

[ui.dialog.theme_picker]
width_percent = 42
height = 20

[pane]
show_hidden = false
default_sort = "natural"
default_sort_reverse = false

[search]
global_search_limit = 200
global_search_chunk_size = 24
show_loading = true
fzf_follow_links = true

[navigation]
fast_move_step = 5
panel_page_step = 10

[behavior]
cancel_search_on_leave = true
